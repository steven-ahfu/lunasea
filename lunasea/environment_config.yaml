environment_config:
  path: system/environment.dart
  class: LunaEnvironment

  fields:
    build:
      type: int
      default: 9999999999
      env_var: BUILD
    commit:
      type: String
      default: master
      env_var: COMMIT
    flavor:
      type: String
      default: edge
      env_var: FLAVOR
    bitcoinAddress:
      type: String
      default: ''
      env_var: BTC_ADDRESS
    moneroAddress:
      type: String
      default: ''
      env_var: MONERO_ADDRESS
