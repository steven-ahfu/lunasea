import com.android.build.api.artifact.SingleArtifact

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "app.dim145.lunasea"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "app.dim145.lunasea"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
       release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
        storePassword keystoreProperties['storePassword']
      }
    }
   
    buildTypes {
      debug {
        applicationIdSuffix ".debug"
        versionNameSuffix "-dev"
      }
      release {
        signingConfig signingConfigs.release
      }
    }
}

// ---------------------------------------------------------------------------
// APK naming - self-describing filenames for local builds and CI.
//
// Flutter hardcodes build/app/outputs/flutter-apk/app-<mode>.apk (see
// FlutterPlugin.kt, filename = "app"), so that path cannot be renamed.
// The two surfaces we do control:
//   1. base.archivesName -> build/app/outputs/apk/<type>/LunaSea_v<ver>-<type>.apk
//   2. the drop dir below -> build/apk/LunaSea_v<ver>-<type>.apk
// CI globs the drop dir, so CI and local filenames are identical.
// ---------------------------------------------------------------------------
def apkAppName = "LunaSea"

base {
    archivesName = "${apkAppName}_v${flutterVersionName}"
}

def apkDropDir = rootProject.layout.buildDirectory.dir("apk")

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantCap = variant.name.capitalize()
        def flavor = variant.flavorName ?: ''
        def buildType = variant.buildType ?: ''
        // Use the pubspec version, NOT variant.outputs.versionName: the debug
        // build type sets versionNameSuffix "-dev", which would otherwise yield
        // LunaSea_v1.3.0-dev-debug.apk and disagree with base.archivesName.
        def versionName = flutterVersionName

        def copyTask = tasks.register("copy${variantCap}ApkToDropDir", Copy) {
            group = "distribution"
            description = "Copies the ${variant.name} APK(s) into build/apk/."
            from(variant.artifacts.get(SingleArtifact.APK.INSTANCE)) {
                include "*.apk"
                rename { String src ->
                    def unsigned = src.endsWith("-unsigned.apk") ? "-unsigned" : ""
                    def out = new StringBuilder(apkAppName)
                    if (flavor) out.append('-').append(flavor)
                    out.append("_v").append(versionName)
                    out.append('-').append(buildType)
                    out.append(unsigned).append(".apk")
                    out.toString()
                }
            }
            into apkDropDir
        }

        tasks.matching { it.name == "assemble${variantCap}" }.configureEach {
            finalizedBy(copyTask)
        }
    }
}

flutter {
    source '../..'
}
