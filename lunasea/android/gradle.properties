org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=false

# Flutter's Gradle plugin is not configuration-cache compatible:
# DependencyVersionChecker holds a WeakHashMap that fails to serialize
# ("module java.base does not open java.lang.ref"). Android Studio turns the
# cache on by default, so pin it off per-project.
org.gradle.configuration-cache=false
